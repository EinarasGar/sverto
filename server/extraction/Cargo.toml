[package]
name = "extraction"
version = "0.1.0"
edition = "2021"

[dependencies]
calamine = { version = "0.37.0", features = ["dates"] }
chardetng = "1.0.0"
csv = "1.3"
encoding_rs = "0.8.35"
pdf_oxide = { version = "0.3.78", default-features = false, features = ["legacy-crypto"] }
pure-rust-locales = "0.8.2"
regex = "1.12.4"
rust_decimal = { version = "1", features = ["serde-with-arbitrary-precision"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1.20"
thiserror = "2"
time = { version = "0.3", features = ["macros", "formatting", "parsing", "serde"] }

[dev-dependencies]
rust_decimal_macros = "1.40.0"
rust_xlsxwriter = "0.100.0"
