services:
  database:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - myra-postgres-data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
  jaeger:
    image: jaegertracing/all-in-one:1.75.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "${JAEGER_UI_PORT}:16686"
      - "${OTLP_PORT}:4318"
  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "${SEQ_PORT}:80"
    volumes:
      - myra-seq-data:/data
  rustfs:
    image: rustfs/rustfs:1.0.2
    ports:
      - "${S3_PORT}:9000"
      - "${S3_CONSOLE_PORT}:9001"
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY}
      - RUSTFS_CONSOLE_ENABLE=true
    volumes:
      - myra-rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
  rustfs-init:
    image: amazon/aws-cli:2.27.0
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      (aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket $${S3_BUCKET_NAME} 2>/dev/null ||
      aws --endpoint-url http://rustfs:9000 s3 mb s3://$${S3_BUCKET_NAME}) &&
      aws --endpoint-url http://rustfs:9000 s3api put-bucket-cors --bucket $${S3_BUCKET_NAME}
      --cors-configuration 'CORSRules=[{AllowedOrigins=[*],AllowedMethods=[GET,PUT,HEAD],AllowedHeaders=[*],ExposeHeaders=[ETag]}]'
      "
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
      - AWS_DEFAULT_REGION=${S3_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  vault:
    image: hashicorp/vault:latest
    restart: unless-stopped
    ports:
      - "${VAULT_PORT}:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_TOKEN}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: server -dev

volumes:
  myra-postgres-data:
  myra-seq-data:
  myra-rustfs-data:
